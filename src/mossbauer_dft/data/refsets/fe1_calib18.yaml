schema_version: '1.0'
id: fe1_calib18
title: Project curated 18-compound 57Fe isomer-shift calibration set (fe1_calib18)
doi: 10.1021/acsomega.7b00595; 10.1021/ct100398m; 10.1021/acs.jctc.1c00722; 10.1021/ic9008784
reference_delta: alpha-Fe (McWilliams entries stated; Bochevarov/Comas-Vila reference not stated in retrieved text)
structure_status: bundled
structure_status_note: 'Starting geometries only (RDKit-built nacnac complexes, COD X-ray structures, hand-built ions); they are re-optimised
  at the plan''s geometry level by `mossbauer refset setup`. Mixed T: 80 K (6 McWilliams entries) and nominal 4.2 K (12 others); second-order-Doppler
  scatter <= ~0.02-0.03 mm/s not corrected.'
curation: Curated in-project (fe1_calib_trainingset_notes.md); held-out project validation targets are NOT in the set. No S- or P-ligated Fe(I), no
  Fe(0)/Fe(IV).
caveats:
  b3lyp_outlier: 'Ferrocene: B3LYP over-predicts delta by about +0.15 mm/s (McWilliams 2017 Table 9); consider excluding from the fit and using
    it as a check.'
  high_leverage_single_Fe(VI)_point: '[FeO4]2-: the only Fe(VI) point, so it has very large leverage on the slope; fit with and without it.'
  delta_T_unverified: '[FeO4]2-: no liquid-He data exist per Bochevarov 2010, so the 4.2 K label is unverified.'
  hand_built_geometry: Geometry is hand built from generic literature-typical bond lengths (or a COD structure with disorder removed / counter-cation
    dropped); starting point for optimization only.
  rdkit_built_geometry: Geometry is an RDKit ETKDG + UFF embed with Fe-ligand distance restraints (no crystal structure retrieved); starting point
    for optimization only.
